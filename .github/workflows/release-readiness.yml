name: release-readiness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Verify package structure
        run: python verify_reproduction_setup.py
      - name: Audit development branch
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python check_public_release.py
      - name: Enforce final release metadata
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: python check_public_release.py --final
